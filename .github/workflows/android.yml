name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          FITDASH_KEYSTORE_B64: ${{ secrets.FITDASH_KEYSTORE_B64 }}
        run: |
          if [ -n "$FITDASH_KEYSTORE_B64" ]; then
            mkdir -p signing
            echo "$FITDASH_KEYSTORE_B64" | base64 -d > signing/fitdash-sideload.jks
          else
            echo "::warning::FITDASH_KEYSTORE_B64 secret not set; APK is signed with a throwaway key and won't install over earlier builds."
          fi
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - name: Show APK signing certificate
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/*.apk | grep -i "SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: fitdash-debug-apk
          path: app/build/outputs/apk/debug/*.apk
